name: pomagappka

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pomagappka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomagappka}
      POSTGRES_DB: ${POSTGRES_DB:-pomagappka}
    volumes:
      - pomagappka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pomagappka} -d ${POSTGRES_DB:-pomagappka}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pomagappka:pomagappka@db:5432/pomagappka}
      APP_URL: ${APP_URL:-http://localhost:5173}
      API_URL: ${API_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-Pomagappka <noreply@localhost>}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-change-me-32chars-minimum!!}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-subijanek@gmail.com}
      PRIVACY_CLEANUP_ENABLED: ${PRIVACY_CLEANUP_ENABLED:-false}
      PRIVACY_CLEANUP_DRY_RUN: ${PRIVACY_CLEANUP_DRY_RUN:-true}
      PRIVACY_PIN_ATTEMPT_RETENTION_DAYS: ${PRIVACY_PIN_ATTEMPT_RETENTION_DAYS:-30}
      PRIVACY_NOTIFICATION_RETENTION_DAYS: ${PRIVACY_NOTIFICATION_RETENTION_DAYS:-90}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - ./package.json:/app/package.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      - ./package.json:/app/package.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - shared_web_node_modules:/app/packages/shared/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

volumes:
  pomagappka_pgdata:
  api_node_modules:
  api_app_node_modules:
  shared_node_modules:
  web_node_modules:
  web_app_node_modules:
  shared_web_node_modules:

networks:
  internal:
    driver: bridge
